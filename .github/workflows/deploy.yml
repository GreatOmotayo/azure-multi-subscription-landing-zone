name: Terraform Infrastructure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: false
        type: string
  pull_request:
    paths: ["*.tf"]
  push:
    branches: [main]
    paths: ["*.tf"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: landing-zone-group
  cancel-in-progress: false

env:
  TF_VAR_platform_subscription_id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}
  TF_VAR_production_subscription_id: ${{ secrets.AZURE_PRODUCTION_SUBSCRIPTION_ID }}
  TF_VAR_non_production_subscription_id: ${{ secrets.AZURE_NONPROD_SUBSCRIPTION_ID }}
  TF_VAR_alert_email_address: ${{ secrets.ALERT_EMAIL_ADDRESS }}
  TF_VAR_shared_resource_group_name: ${{ vars.SHARED_RG_NAME }}
  TF_VAR_oidc_service_principal_object_id: ${{ secrets.OIDC_SP_OBJECT_ID}}
  TF_VAR_tenant_domain: ${{ secrets.TENANT_DOMAIN }}
  TF_VAR_budget_amount: ${{ vars.BUDGET_AMOUNT }}
  TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="subscription_id=${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform format
        run: terraform fmt -check -recursive -diff

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Post plan output to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan \n\`\`\`\n${{steps.plan.outputs.stdout}}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="use_oidc=true" \
            -backend-config="subscription_id=${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply
        run: terraform apply -auto-approve
